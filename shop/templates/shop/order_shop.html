{% load static %}
<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація улюбленця | PetCare</title>
    <link rel="stylesheet" href="{% static 'main/css/regiser.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Додамо трохи стилів для завантаження фото, якщо їх немає в CSS */
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #4B5563; }
        .file-upload-wrapper {
            border: 2px dashed #A78BFA;
            padding: 15px;
            border-radius: 12px;
            background: #F5F3FF;
            text-align: center;
        }
        .input-field-file { width: 100%; cursor: pointer; }
    </style>
</head>

<body>
    <div class="reg-container">
        <div class="reg-card">
            <div class="reg-header">
                <div class="logo">Pet<span>Care</span></div>
                <h1>Новий хвостик</h1>
                <p>Додайте інформацію про вашого улюбленця</p>
            </div>

            <form id="pet-registration-form" method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="input-group">
                    <label>Тип тварини</label>
                    {{ form.type_pets }}
                </div>

                <div class="input-group">
                    <label>Порода</label>
                    {{ form.poroda }}
                </div>

                <div class="input-group">
                    <label>Кличка</label>
                    {{ form.name }}
                </div>

                <div class="input-row" style="display: flex; gap: 15px;">
                    <div class="input-group" style="flex: 1;">
                        <label>Вік</label>
                        {{ form.age }}
                    </div>
                    <div class="input-group" style="flex: 1;">
                        <label>Вага (кг)</label>
                        {{ form.weight }}
                    </div>
                </div>

                <div class="input-group">
                    <label>Номер паспорта</label>
                    {{ form.passport_number }}
                </div>

                <div class="input-group">
                    <label>Фото улюбленця</label>
                    <div class="file-upload-wrapper">
                        {{ form.img }}
                    </div>
                </div>

                <button type="submit" class="btn-reg" style="margin-top: 20px; width: 100%; padding: 14px; background: #7C3AED; color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer;">
                    Зберегти хвостика ✨
                </button>

                <p class="footer-text" style="text-align: center; margin-top: 20px;">
                    <a href="{% url 'home' %}" style="color: #6B7280; text-decoration: none; font-size: 0.9rem;">← Повернутися на головну</a>
                </p>
            </form>
        </div>
    </div>
</body>

</html>
