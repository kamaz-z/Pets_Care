{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>PetCare | Головна</title>
    <link rel="stylesheet" href="{% static 'main/css/regiser.css' %}">
    <link rel="stylesheet" href="{% static 'main/css/style.css' %}">
</head>
<body>
    <nav class="Menu_container">
        <ul>
            <li><a href="{% url 'home' %}">Головна</a></li>
            <li><a href="{% url 'register_pets' %}">Додати тварину</a></li>
            <li><a href="#">Послуги</a></li>
            <li><a href="{% url 'register' %}">Профіль</a></li>
        </ul>
    </nav>

    <div class="container">
        <header style="margin-bottom: 40px;">
            <h1 style="font-size: 2.5rem;">Привіт, <span style="color: #a361ff;">Олександре!</span></h1>
            <p style="color: #ccc;">Сьогодні чудовий день, щоб подбати про друзів.</p>
        </header>

        <div class="dashboard-grid">
            <!-- Основна картка тварини -->
            <section class="pet-main-card">
                <div class="pet-image-container">
                    <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=format&fit=crop&q=80&w=500" alt="Pet">
                </div>
                <div class="pet-details">
                    <h2 style="margin: 0; font-size: 2rem;">Барсік</h2>
                    <p style="color: #aaa; margin: 10px 0;">Золотистий ретривер • 3 роки</p>
                    <div class="stats-row">
                        <div class="stat-item"><strong>25 кг</strong><br><small>Вага</small></div>
                        <div class="stat-item"><strong>№12345</strong><br><small>Паспорт</small></div>
                    </div>
                </div>
            </section>

            <!-- Бокова панель: Картка -->
            <aside class="dog_history">
                <h3 style="color: #fff; border-bottom: 2px solid #6911ce; padding-bottom: 10px;">Медична картка</h3>
                <div class="history_card" style="background: rgba(255,255,255,0.1); color: white;">
                    <span class="date">12.04.2024</span>
                    <h4>Щеплення від сказу</h4>
                    <p style="color: #ddd;">Вакцина: Nobivac Rabies.</p>
                </div>
                <!-- Можна продублювати ще карти тут -->
            </aside>
        </div>
    </div>
</body>
</html>
