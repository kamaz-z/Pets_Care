{% load static %}
<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід | PetCare Control</title>
    <link rel="stylesheet" href="{% static 'main/css/regiser.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="reg-container">
        <div class="reg-card">
            <div class="reg-header">
                <div class="logo">Pet<span>Care</span></div>
                <h1>Вхід у профіль</h1>
                <p>Раді бачити вас знову!</p>
            </div>

            {% if error %}
            <div class="form-errors" style="color: red; margin-bottom: 15px; text-align: center;">
                {{ error }}
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="form-group">
                    <input type="text" name="username" class="input-field" placeholder="Ваш логін" required>
                </div>

                <div class="form-group">
                    <input type="password" name="password" class="input-field" placeholder="Ваш пароль" required>
                </div>

                <button type="submit">
                    Увійти
                </button>
            </form>
        </div>
        <h3>ще немає акаунта?</h3>
        <button type="submit"><a href="{% url 'register' %}">Зареєструватися</a>
            
        </button>

    </div>
</body>

</html>
